name: MarketFusion CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python syntax, tests, and safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install portable test dependencies
        run: python -m pip install --upgrade pip "numpy>=1.26" "pandas>=2.2" "pyarrow>=15.0" "joblib>=1.3" "scikit-learn>=1.4" "requests>=2.31" "fastapi>=0.115,<1.0" "uvicorn>=0.34,<1.0" "httpx>=0.28,<1.0"

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Repository safety preflight
        run: python scripts/repo_safety_check.py

      - name: Run unit tests
        if: always()
        run: python -m unittest discover -s tests -v

  frontend-quality:
    name: V0.7 frontend typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  jforex-build:
    name: JForex Java 8 compile
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate all PowerShell syntax
        shell: pwsh
        run: |
          $files = @(Get-ChildItem scripts -Filter '*.ps1' -File)
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed: $file"
            }
            Write-Host "PowerShell syntax PASS: $($file.Name)"
          }

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          cache: maven

      - name: Provide compile-only JNLP API placeholder when WebStart is absent
        shell: pwsh
        run: |
          $line = (& java -XshowSettings:properties -version 2>&1 | Select-String 'java.home =').ToString()
          $javaHome = ($line -split '=', 2)[1].Trim()
          $javaws = Join-Path $javaHome 'lib\javaws.jar'
          if (-not (Test-Path $javaws)) {
            $empty = Join-Path $env:RUNNER_TEMP 'empty-jnlp'
            New-Item -ItemType Directory -Force -Path $empty | Out-Null
            New-Item -ItemType Directory -Force -Path (Split-Path $javaws) | Out-Null
            & jar cf $javaws -C $empty .
            Write-Host "Created compile-only placeholder at $javaws"
          } else {
            Write-Host "JDK already provides $javaws"
          }
          java -version
          mvn -version

      - name: Compile and test JForex exporter
        run: mvn -B -ntp -f jforex-event-exporter/pom.xml clean test
